<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZOne X 火茂山丈 聯名選單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-tab { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 900; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-32">

  <nav class="bg-white sticky top-0 z-40 shadow-sm border-b">
    <div class="flex text-center">
      <button onclick="switchBrand('ZOne')" id="tab-ZOne" class="flex-1 py-4 text-gray-400 transition-all active-tab text-sm tracking-widest">ZOne 酒館</button>
      <button onclick="switchBrand('Huamao')" id="tab-Huamao" class="flex-1 py-4 text-gray-400 transition-all text-sm tracking-widest">火茂山丈 燒烤</button>
    </div>
  </nav>

  <main class="p-4 max-w-md mx-auto">
    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-4"></div>
      <p class="text-gray-400 animate-pulse">同步 ZOne X 火茂山丈 營運數據...</p>
    </div>
    <div id="menu-container" class="space-y-10 hidden"></div>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-4 pb-8 z-50 shadow-2xl">
    <div class="max-w-md mx-auto flex justify-between items-center px-2">
      <div>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">ESTIMATED TOTAL</p>
        <p class="text-3xl font-black text-indigo-600">$ <span id="total-price">0</span></p>
      </div>
      <button class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100 active:scale-95 transition-all">
        確認清單 (<span id="total-qty">0</span>)
      </button>
    </div>
  </footer>

  <div id="modal" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-6 backdrop-blur-md" onclick="closeModal()">
    <div class="bg-white rounded-[2.5rem] overflow-hidden max-w-sm w-full shadow-2xl animate-in fade-in zoom-in duration-300" onclick="event.stopPropagation()">
      <div id="modal-img" class="h-72 bg-slate-100 bg-cover bg-center shadow-inner"></div>
      <div class="p-8">
        <h2 id="modal-name" class="text-2xl font-black text-gray-800"></h2>
        <div class="h-1 w-12 bg-indigo-500 my-4 rounded-full"></div>
        <p id="modal-desc" class="text-gray-500 leading-relaxed text-sm"></p>
        <button onclick="closeModal()" class="mt-10 w-full bg-slate-50 py-4 rounded-2xl font-bold text-gray-400 active:bg-slate-100">關閉視窗</button>
      </div>
    </div>
  </div>

  <script>
    let rawMenuData = {};
    let allProducts = {}; // 用於快速查找單價 { id: price }
    let currentBrand = "ZOne";
    let cart = {}; 

    async function init() {
      try {
        await liff.init({ liffId: "2009972806-P4cPUWMS" });
        if (!liff.isLoggedIn()) liff.login();
        fetchMenu();
      } catch (err) { alert("初始化失敗: " + err.message); }
    }

    function fetchMenu() {
      const GAS_URL = "https://script.google.com/macros/s/AKfycbzHWEQt8cjI8ne6pWPD3p-M35vzM5hLtvE-rSg3GfoOklXUxsNcOtwkVTuEdXyFhYeGvA/exec";
      fetch(`${GAS_URL}?action=getMenu`)
        .then(res => res.json())
        .then(data => {
          rawMenuData = data;
          // 建立全域產品索引，方便算錢
          for(let b in data) {
            for(let c in data[b]) {
              data[b][c].forEach(p => { allProducts[p.id] = p; });
            }
          }
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('menu-container').classList.remove('hidden');
          switchBrand('ZOne');
        })
        .catch(err => alert("讀取數據失敗：" + err));
    }

    function switchBrand(brand) {
      currentBrand = brand;
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
      document.getElementById(`tab-${brand}`).classList.add('active-tab');
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      const brandData = rawMenuData[currentBrand] || {};
      let html = "";

      if (Object.keys(brandData).length === 0) {
        html = `<div class="text-center py-20 text-gray-300">目前沒有可供應的項目</div>`;
      } else {
        for (let cat in brandData) {
          html += `<section><div class="flex items-center gap-2 mb-5 px-2"><div class="h-5 w-1 bg-indigo-600 rounded-full"></div><h3 class="font-black text-lg text-slate-800 tracking-wider">${cat}</h3></div><div class="grid gap-4">`;
          brandData[cat].forEach(item => {
            const qty = cart[item.id] || 0;
            html += `
              <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm flex items-center gap-4 active:bg-slate-50 transition-colors">
                <div onclick="showModal('${item.id}')" class="w-16 h-16 bg-slate-100 rounded-2xl flex-shrink-0 bg-cover bg-center border" style="background-image: url('${item.img || ''}')"></div>
                <div class="flex-1" onclick="showModal('${item.id}')">
                  <h4 class="font-bold text-gray-800">${item.name}</h4>
                  <p class="text-indigo-600 font-black text-xl">$${item.price}</p>
                </div>
                <div class="flex items-center bg-slate-100/50 rounded-2xl p-1 border border-slate-200">
                  <button onclick="updateQty('${item.id}', -1)" class="w-10 h-10 font-bold text-gray-400 active:text-indigo-600">-</button>
                  <span id="qty-${item.id}" class="w-8 text-center font-black text-indigo-700">${qty}</span>
                  <button onclick="updateQty('${item.id}', 1)" class="w-10 h-10 font-bold text-indigo-600 active:scale-125">+</button>
                </div>
              </div>`;
          });
          html += `</div></section>`;
        }
      }
      container.innerHTML = html;
    }

    function updateQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] < 0) cart[id] = 0;
      
      const qtySpan = document.getElementById(`qty-${id}`);
      if (qtySpan) qtySpan.innerText = cart[id];
      
      calculateTotal();
    }

    function calculateTotal() {
      let totalMoney = 0;
      let totalCount = 0;
      for (let id in cart) {
        if (allProducts[id]) {
          totalMoney += cart[id] * allProducts[id].price;
          totalCount += cart[id];
        }
      }
      document.getElementById('total-price').innerText = totalMoney.toLocaleString();
      document.getElementById('total-qty').innerText = totalCount;
    }

    function showModal(id) {
      const item = allProducts[id];
      if (!item) return;
      document.getElementById('modal-name').innerText = item.name;
      document.getElementById('modal-desc').innerText = item.desc || "火茂山丈 X ZOne 職人嚴選，暫無詳細描述。";
      document.getElementById('modal-img').style.backgroundImage = `url('${item.img || ''}')`;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    window.onload = init;
  </script>
</body>
</html>
