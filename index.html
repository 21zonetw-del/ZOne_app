<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOne X 火茂山丈 聯合行動燒烤酒吧</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-indigo-900 text-white p-6 sticky top-0 z-50 shadow-lg">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-black">ZOne X 火茂山丈</h1>
        <div class="flex items-center gap-2 mt-1 opacity-80">
          <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
          <p id="userName" class="text-xs">營運系統啟動中...</p>
        </div>
      </div>
      <div id="userPic" class="w-12 h-12 rounded-2xl border-2 border-white/20 overflow-hidden bg-white/10"></div>
    </div>
  </header>

  <main class="p-4 max-w-md mx-auto">
    <div id="loading" class="space-y-6">
      <div class="h-6 bg-gray-200 rounded-md w-1/3 animate-pulse"></div>
      <div class="h-24 bg-gray-200 rounded-3xl animate-pulse"></div>
      <div class="h-24 bg-gray-200 rounded-3xl animate-pulse"></div>
      <p class="text-center text-gray-400 text-sm">正在同步聯合營運數據...</p>
    </div>
    <div id="content" class="hidden space-y-10 pb-20"></div>
  </main>

  <script>
    const LIFF_ID = "2009972806-P4cPUWMS"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzHWEQt8cjI8ne6pWPD3p-M35vzM5hLtvE-rSg3GfoOklXUxsNcOtwkVTuEdXyFhYeGvA/exec"; 

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        document.getElementById('userName').innerText = `你好，${profile.displayName}`;
        if (profile.pictureUrl) {
          document.getElementById('userPic').innerHTML = `<img src="${profile.pictureUrl}" class="w-full h-full object-cover">`;
        }
        loadMenu();
      } catch (err) { alert("LIFF 啟動失敗：" + err.message); }
    }

    function loadMenu() {
      fetch(`${GAS_URL}?action=getMenu`)
        .then(res => res.json())
        .then(data => {
          if (data["錯誤"]) throw new Error(data["錯誤"]);
          let html = "";
          for (let cat in data) {
            html += `
              <section>
                <div class="flex items-center gap-3 mb-5">
                  <div class="h-6 w-1.5 bg-indigo-600 rounded-full"></div>
                  <h3 class="font-black text-xl text-gray-800">${cat}</h3>
                </div>
                <div class="grid gap-4">`;
            
            data[cat].forEach(item => {
              html += `
                <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 flex justify-between items-center active:scale-[0.97] transition-transform">
                  <div class="flex-1">
                    <h4 class="font-bold text-gray-900 text-lg">${item.name}</h4>
                    <div class="text-indigo-600 font-black text-2xl mt-1">$${item.price}</div>
                  </div>
                  <button class="bg-indigo-600 text-white font-bold px-6 py-3 rounded-2xl shadow-lg shadow-indigo-200">選購</button>
                </div>`;
            });
            html += `</div></section>`;
          }
          document.getElementById('content').innerHTML = html;
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('content').classList.remove('hidden');
        })
        .catch(err => {
          console.error(err);
          alert("數據載入失敗，請確認 GAS 部署是否正確。\n詳情：" + err.message);
        });
    }
    window.onload = initLiff;
  </script>
</body>
</html>
